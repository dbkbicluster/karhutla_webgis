<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.21/dist/css/uikit.min.css" />
        <link rel="stylesheet" href="./resources/style.css">
        <title>WebGIS DBK | Karhutla</title>
    </head>
    <body>
        <nav class="uk-background-primary uk-navbar dbk-navbar" uk-navbar>
            <!-- BARIS KIRI -->
            <div class="uk-navbar-left dbk-brand">
                <a class="uk-navbar-item uk-logo" href="/">
                    <img src="images/dbk_logo_transparent.png" alt="DBK">
                    <span>WebGIS</span>
                </a>
            </div>

            <!-- DOWNLOAD -->
            <div class="uk-navbar-right dbk-download">
                <a class="uk-navbar-item"
                href="#modal-download"
                uk-toggle>
                    Download Data
                </a>
            </div>

            <!-- SEARCH -->
            <div class="dbk-search">

                <input
                    id="coordInput"
                    class="uk-input"
                    type="text"
                    placeholder="Lat, Lon">

                <button
                    class="uk-button uk-button-default"
                    onclick="searchCoordinate()">
                    CARI BY KOORDINAT
                </button>

                <select
                    class="uk-select"
                    id="aoiDropdown"
                    onchange="zoomToAOI()">

                    <option value="" disabled selected>
                        Pilih AOI
                    </option>

                    <option value="area1">Segment A</option>
                    <option value="area2">Segment B</option>
                    <option value="area3">Segment C</option>
                    <option value="area4">PIT DBK</option>

                </select>

            </div>

        </nav>
        <!-- Konten WebGIS -->
        <section class="uk-height-1-1">
            <div id="map" style="width: 1980px; height: 1080px;">
                <div id="popup" class="ol-popup">
                    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                    <div id="popup-content">
                    </div>
                </div>
            </div>
            <button id="fire-dashboard-toggle" class="fire-dashboard-toggle" type="button" aria-label="Buka dashboard">Open Dashboard</button>
            <aside id="fire-dashboard" class="fire-dashboard" aria-label="Dashboard monitoring kebakaran hutan">
                <div class="fire-dashboard-header">
                    <div>
                        <span class="fire-dashboard-kicker">Monitoring</span>
                        <h3>Kebakaran Hutan</h3>
                    </div>
                    <button id="fire-dashboard-close" type="button" aria-label="Tutup dashboard">×</button>
                </div>

                <div class="fire-dashboard-stats">
                    <div class="fire-stat fire-stat--total">
                        <span id="fire-total">0</span>
                        <small>Total Titik</small>
                    </div>
                    <div class="fire-stat fire-stat--active">
                        <span id="fire-active">0</span>
                        <small>Aktif</small>
                    </div>
                    <div class="fire-stat fire-stat--done">
                        <span id="fire-done">0</span>
                        <small>Padam</small>
                    </div>
                    <div class="fire-stat fire-stat--area">
                        <span id="fire-area-total">0</span>
                        <small>Ha Terpantau</small>
                    </div>
                </div>

                <div class="fire-dashboard-filter">
                    <button type="button" class="fire-filter-btn is-active" data-status="all">Semua</button>
                    <button type="button" class="fire-filter-btn" data-status="Aktif">Aktif</button>
                    <button type="button" class="fire-filter-btn" data-status="Sudah Padam">Padam</button>
                </div>

                <div class="fire-dashboard-meta">
                    <span>Update: 28 Agustus 2026</span>
                </div>

                <div id="fire-chart" class="fire-chart" aria-label="Grafik distribusi kebakaran"></div>

                <div id="fire-incident-list" class="fire-incident-list"></div>
            </aside>
            <div id="mouse-coord" style="
                    position: absolute;
                    bottom: 10px;
                    left: 10px;
                    background: rgba(255,255,255,0.8);
                    padding: 4px 8px;
                    border-radius: 4px;
                    font-size: 12px;
                    font-family: monospace;
                    z-index: 1000;">
                Koordinat: -
                </div>
        </section>
        <!-- This is the modal -->
        <div id="modal-download" uk-modal>
            <div class="uk-modal-dialog uk-modal-body">
                <h2 class="uk-modal-title">Keterangan</h2>
                <a href="#"><div class="uk-button uk-button-primary uk-light">Download Data</div></a>
                <p>Data dalam bentuk geojson, bisa dibuka di qgis lalu export jadi shp atau tipe data lainnya</p>
            </div>
        </div>
        <!-- Modal login -->
        <div id="loginModal">
        <div class="login-box">
            <h2>Login WebGIS</h2>
            <input type="text" id="username" placeholder="Username"><br>
            <input type="password" id="password" placeholder="Password"><br>
            <button onclick="checkLogin()">Login</button>
            <p id="error" style="color:red; display:none;">Username / Password salah!</p>
        </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.21/dist/js/uikit.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.21/dist/js/uikit-icons.min.js"></script>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>

        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script src="./resources/main.js"></script>        
    </body>
</html>
