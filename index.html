                    </div>
                </div>
            </div>
            <div id="mouse-coord" style="

                    border-radius: 4px;
                    font-size: 12px;
                    font-family: monospace;
                    z-index: 1000;">

        </section>

                <p>Data dalam bentuk geojson, bisa dibuka di qgis lalu export jadi shp atau tipe data lainnya</p>
            </div>
        </div>
        <!-- Modal login -->
        <div id="loginModal">
        <div class="login-box">
            <h2>Login WebGIS</h2>
            <input type="text" id="username" placeholder="Username"><br>
            <input type="password" id="password" placeholder="Password"><br>
            <button onclick="checkLogin()">Login</button>
            <p id="error" style="color:red; display:none;">Username / Password salah!</p>
